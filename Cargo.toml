[package]
name = "aurlens"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "AI-assisted review of AUR build recipes before execution"
license = "MIT"
repository = "https://github.com/0xgui/aurlens"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rustix = { version = "1.1", features = ["event", "fs", "process", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
toml = "0.9"
tempfile = "3"

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
