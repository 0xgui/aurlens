name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust checks
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Drive the release CLI
        env:
          RUSTUP_TOOLCHAIN: stable
        run: .agents/skills/verify-aurlens/scripts/verify.sh run "$RUNNER_TEMP/aurlens-cli-evidence"
      - name: Retain CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurlens-cli-evidence
          path: ${{ runner.temp }}/aurlens-cli-evidence

  adapter-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Shelly adapter protocol
        shell: bash
        run: |
          set -euo pipefail
          zig_dir="$RUNNER_TEMP/aurlens-zig"
          mkdir "$zig_dir"
          curl --fail --location --retry 3 https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$zig_dir/zig.tar.xz"
          printf '%s  %s\n' 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 "$zig_dir/zig.tar.xz" | sha256sum --check --strict
          tar -xJf "$zig_dir/zig.tar.xz" -C "$zig_dir"
          "$zig_dir/zig-x86_64-linux-0.17.0/zig" fmt --check integrations/shelly/aurlens.zig
          "$zig_dir/zig-x86_64-linux-0.17.0/zig" test integrations/shelly/aurlens.zig

  minimum-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --locked
